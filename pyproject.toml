[project]
name = "kgc"
version = "0.1.0"
description = "Multi-repo code graph POC: graphify + Neo4j + MCP"
requires-python = ">=3.11"
dependencies = [
    "graphifyy[mcp]==0.9.74",
    "neo4j>=5.28",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
kgc = "kgc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
